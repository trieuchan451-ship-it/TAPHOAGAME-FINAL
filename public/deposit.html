<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nạp tiền</title><link rel="stylesheet" href="/style.css"></head><body><div class="topbar"><div class="head"><div class="brand">TAPHOAGAME.VN<small>MARKETPLACE TÀI KHOẢN GAME</small></div><div class="search"><input id="searchInput" placeholder="Tìm acc, game, người bán..."><button onclick="searchNow()">TÌM</button></div><div class="userbar"><span class="pill">Số dư: <b id="balance">0đ</b></span><button class="btn primary" onclick="openAccount()">TÀI KHOẢN</button></div></div><nav><a href="/">TRANG CHỦ</a><a href="/products.html">MUA ACC</a><a href="/deposit.html">NẠP TIỀN</a><a href="/history.html">LỊCH SỬ</a><a href="/seller.html">BÁN HÀNG</a></nav></div><div class="mobile-bottom"><a href="/">TRANG CHỦ</a><a href="/products.html">MUA ACC</a><a href="/deposit.html">NẠP TIỀN</a><a href="/seller.html">BÁN HÀNG</a><a href="/account.html">CÁ NHÂN</a></div><main class="wrap"><div class="card"><h1>NẠP TIỀN</h1><div class="notice">Tạo yêu cầu không tự cộng tiền. Tiền chỉ được cộng sau webhook hợp lệ hoặc Admin xác nhận đã nhận tiền thật.</div><input id="amount" type="number" placeholder="Số tiền từ 10.000đ"><button class="btn primary" onclick="create()">TẠO YÊU CẦU</button><div id="info"></div><hr><h2>LỊCH SỬ NẠP</h2><div id="list"></div></div></main><script>
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Có lỗi xảy ra');return j}
function money(n){return Number(n||0).toLocaleString('vi-VN')+'đ'}
async function current(){try{const u=await api('/api/me');document.querySelectorAll('#balance').forEach(e=>e.textContent=money(u.balance));return u}catch{return null}}
async function openAccount(){const u=await current();if(!u)return location.href='/?login=1';location.href=u.role==='admin'?'/admin.html':u.role==='seller'?'/seller.html':'/account.html'}
function searchNow(){const q=(document.getElementById('searchInput')?.value||'').trim();location.href='/products.html'+(q?'?q='+encodeURIComponent(q):'')}
async function create(){try{const d=await api('/api/deposits',{method:'POST',body:JSON.stringify({amount:Number(amount.value)})});info.innerHTML=`<div class="card"><b>Chuyển: ${money(d.amount)}</b><p>Ngân hàng: ${d.bank.name||'Chưa cấu hình'}</p><p>STK: ${d.bank.account||'Chưa cấu hình'}</p><p>Chủ TK: ${d.bank.accountName||'Chưa cấu hình'}</p><p>Nội dung: <b>${d.transfer_code}</b></p></div>`;load()}catch(e){alert(e.message)}}async function load(){const u=await current();if(!u)return location.href='/?login=1';const x=await api('/api/deposits/mine');list.innerHTML=x.length?x.map(d=>`<div class="card">${money(d.amount)} • ${d.transfer_code} • <b>${d.status}</b></div>`).join(''):'<div class="empty">CHƯA CÓ YÊU CẦU NẠP</div>'}load();</script></body></html>
