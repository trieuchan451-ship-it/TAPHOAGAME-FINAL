<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat</title><link rel="stylesheet" href="/style.css"></head><body><div class="topbar"><div class="head"><div class="brand">TAPHOAGAME.VN<small>MARKETPLACE TÀI KHOẢN GAME</small></div><div class="search"><input id="searchInput" placeholder="Tìm acc, game, người bán..."><button onclick="searchNow()">TÌM</button></div><div class="userbar"><span class="pill">Số dư: <b id="balance">0đ</b></span><button class="btn primary" onclick="openAccount()">TÀI KHOẢN</button></div></div><nav><a href="/">TRANG CHỦ</a><a href="/products.html">MUA ACC</a><a href="/deposit.html">NẠP TIỀN</a><a href="/history.html">LỊCH SỬ</a><a href="/seller.html">BÁN HÀNG</a></nav></div><div class="mobile-bottom"><a href="/">TRANG CHỦ</a><a href="/products.html">MUA ACC</a><a href="/deposit.html">NẠP TIỀN</a><a href="/seller.html">BÁN HÀNG</a><a href="/account.html">CÁ NHÂN</a></div><main class="wrap"><div class="card"><h1>CHAT</h1><div id="messages" style="height:360px;overflow:auto;border:1px solid #303961;border-radius:10px;padding:10px"></div><div class="row"><input id="message" placeholder="Nhập tin nhắn"><button class="btn primary" onclick="send()">GỬI</button></div></div></main><script>
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Có lỗi xảy ra');return j}
function money(n){return Number(n||0).toLocaleString('vi-VN')+'đ'}
async function current(){try{const u=await api('/api/me');document.querySelectorAll('#balance').forEach(e=>e.textContent=money(u.balance));return u}catch{return null}}
async function openAccount(){const u=await current();if(!u)return location.href='/?login=1';location.href=u.role==='admin'?'/admin.html':u.role==='seller'?'/seller.html':'/account.html'}
function searchNow(){const q=(document.getElementById('searchInput')?.value||'').trim();location.href='/products.html'+(q?'?q='+encodeURIComponent(q):'')}
const q=new URLSearchParams(location.search),other=Number(q.get('with')),product=Number(q.get('product')||0);let uid=0;async function load(){const u=await current();if(!u)return location.href='/?login=1';uid=u.id;const x=await api('/api/chat?with='+other+'&product='+product);messages.innerHTML=x.map(m=>`<div class="card" style="max-width:80%;${m.sender_id==uid?'margin-left:auto;background:#4a2380':''}"><b>${m.sender}</b><br>${m.message}</div>`).join('');messages.scrollTop=messages.scrollHeight}async function send(){if(!message.value.trim())return;await api('/api/chat',{method:'POST',body:JSON.stringify({to:other,product,message:message.value})});message.value='';load()}load();setInterval(load,5000);</script></body></html>
