<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat</title><link rel="stylesheet" href="/style.css?v=20"></head><body>
<div class="site-header"><div class="shell"><div class="header-main"><a class="brand" href="/"><div class="brand-logo">TG</div><div><strong>TAPHOAGAME.VN</strong><small>PREMIUM GAME ACCOUNT MARKETPLACE</small></div></a><div class="search"><input id="q" placeholder="Tìm kiếm acc theo game, giá, người bán..."><button onclick="doSearch()">TÌM</button></div><div class="user-actions"><div class="wallet"><small>SỐ DƯ</small><b data-balance>0đ</b></div><a class="btn primary" href="/deposit.html">+ NẠP TIỀN</a><button class="btn" onclick="goAccount()">TÀI KHOẢN</button></div></div><div class="nav"><a href="/">TRANG CHỦ</a><a href="/products.html">TẤT CẢ ACC</a><a href="/deposit.html">NẠP TIỀN</a><a href="/history.html">LỊCH SỬ</a><a href="/seller.html">BÁN HÀNG</a><a href="/account.html">CÁ NHÂN</a></div></div></div><div class="mobile-nav"><a href="/">TRANG CHỦ</a><a href="/products.html">MUA ACC</a><a href="/deposit.html">NẠP TIỀN</a><a href="/seller.html">BÁN HÀNG</a><a href="/account.html">CÁ NHÂN</a></div>
<main class="shell page"><div class="panel content"><div class="section-head" style="margin-top:0"><h1>CHAT NGƯỜI BÁN</h1></div><div id="messages" style="height:420px;overflow:auto;border:1px solid #303963;border-radius:10px;padding:10px;background:#080d1d"></div><div class="row" style="margin-top:8px"><input id="message" placeholder="Nhập tin nhắn..."><button class="btn primary" onclick="send()">GỬI</button></div></div></main><script>
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Có lỗi xảy ra');return j}
function money(n){return Number(n||0).toLocaleString('vi-VN')+'đ'}
async function current(){try{const u=await api('/api/me');document.querySelectorAll('[data-balance]').forEach(x=>x.textContent=money(u.balance));return u}catch{return null}}
async function goAccount(){const u=await current();if(!u){openAuth();return}location.href=u.role==='admin'?'/admin.html':u.role==='seller'?'/seller.html':'/account.html'}
function doSearch(){const q=(document.getElementById('q')?.value||'').trim();location.href='/products.html'+(q?'?q='+encodeURIComponent(q):'')}
function openAuth(){document.getElementById('auth')?.classList.add('open')}function closeAuth(){document.getElementById('auth')?.classList.remove('open')}
function tab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id==='pane-'+t))}
async function login(){try{const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({identity:li.value,password:lp.value})});location.href=r.redirect}catch(e){alert(e.message)}}
async function register(){try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({username:ru.value,email:re.value,password:rp.value})});location.href='/account.html'}catch(e){alert(e.message)}}
async function logout(){await api('/api/auth/logout',{method:'POST'});location.href='/'}
const qs=new URLSearchParams(location.search),other=Number(qs.get('with')),product=Number(qs.get('product')||0);let uid=0;async function load(){const u=await current();if(!u)return location.href='/?login=1';uid=u.id;const x=await api('/api/chat?with='+other+'&product='+product);messages.innerHTML=x.map(m=>`<div class="panel content" style="max-width:78%;margin:6px 0;${m.sender_id==uid?'margin-left:auto;background:#28154c':''}"><b>${m.sender}</b><div style="margin-top:4px">${m.message}</div></div>`).join('');messages.scrollTop=messages.scrollHeight}async function send(){if(!message.value.trim())return;await api('/api/chat',{method:'POST',body:JSON.stringify({to:other,product,message:message.value})});message.value='';load()}load();setInterval(load,5000);</script></body></html>
