<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cá nhân</title><link rel="stylesheet" href="/style.css"></head><body><div class="topbar"><div class="head"><div class="brand">TAPHOAGAME.VN<small>MARKETPLACE TÀI KHOẢN GAME</small></div><div class="search"><input id="searchInput" placeholder="Tìm acc, game, người bán..."><button onclick="searchNow()">TÌM</button></div><div class="userbar"><span class="pill">Số dư: <b id="balance">0đ</b></span><button class="btn primary" onclick="openAccount()">TÀI KHOẢN</button></div></div><nav><a href="/">TRANG CHỦ</a><a href="/products.html">MUA ACC</a><a href="/deposit.html">NẠP TIỀN</a><a href="/history.html">LỊCH SỬ</a><a href="/seller.html">BÁN HÀNG</a></nav></div><div class="mobile-bottom"><a href="/">TRANG CHỦ</a><a href="/products.html">MUA ACC</a><a href="/deposit.html">NẠP TIỀN</a><a href="/seller.html">BÁN HÀNG</a><a href="/account.html">CÁ NHÂN</a></div><main class="wrap"><div class="section-head"><h1>TRANG CÁ NHÂN</h1></div><div id="profile" class="grid"></div><div style="margin-top:12px"><a class="btn" href="/history.html">LỊCH SỬ</a> <a class="btn" href="/deposit.html">NẠP TIỀN</a> <a class="btn" href="/seller.html">ĐĂNG KÝ BÁN HÀNG</a> <button class="btn bad" onclick="logout()">ĐĂNG XUẤT</button></div></main><script>
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Có lỗi xảy ra');return j}
function money(n){return Number(n||0).toLocaleString('vi-VN')+'đ'}
async function current(){try{const u=await api('/api/me');document.querySelectorAll('#balance').forEach(e=>e.textContent=money(u.balance));return u}catch{return null}}
async function openAccount(){const u=await current();if(!u)return location.href='/?login=1';location.href=u.role==='admin'?'/admin.html':u.role==='seller'?'/seller.html':'/account.html'}
function searchNow(){const q=(document.getElementById('searchInput')?.value||'').trim();location.href='/products.html'+(q?'?q='+encodeURIComponent(q):'')}

async function load(){const u=await current();if(!u)return location.href='/?login=1';if(u.role==='admin')return location.href='/admin.html';if(u.role==='seller')return location.href='/seller.html';profile.innerHTML=`<div class="card">Tên đăng nhập<br><b>${u.username}</b></div><div class="card">Email<br><b>${u.email}</b></div><div class="card">Số dư<br><b>${money(u.balance)}</b></div><div class="card">Bán hàng<br><b>${u.seller_verification}</b></div><div class="card">SĐT<br><b>${u.phone||'Chưa cập nhật'}</b></div><div class="card">Xác minh SĐT<br><b>${u.phone_verified?'Đã xác minh':'Chưa xác minh'}</b></div>`}async function logout(){await api('/api/auth/logout',{method:'POST'});location.href='/'}load();</script></body></html>
