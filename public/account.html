<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cá nhân</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="site-header"><div class="header-inner"><a class="logo" href="/"><div class="logo-mark">TG</div><div><strong>TAPHOAGAME.VN</strong><small>ACC VIP • GIAO DỊCH AN TOÀN</small></div></a><div class="searchbar"><input id="globalSearch" placeholder="Tìm kiếm acc theo game, giá, người bán..."><button onclick="doSearch()">TÌM</button></div><div class="accountbar"><div class="balance"><small>SỐ DƯ CỦA BẠN</small><b data-balance>0đ</b></div><a class="btn primary" href="/deposit.html">+ NẠP TIỀN</a><button class="btn" onclick="goAccount()">TÀI KHOẢN</button></div></div><div class="main-nav"><a href="/">TRANG CHỦ</a><a href="/products.html">TẤT CẢ ACC</a><a href="/deposit.html">NẠP TIỀN</a><a href="/history.html">LỊCH SỬ MUA</a><a href="/seller.html">BÁN HÀNG</a><a href="/account.html">CÁ NHÂN</a></div></div><div class="mobile-bottom"><a href="/">TRANG CHỦ</a><a href="/products.html">MUA ACC</a><a href="/deposit.html">NẠP TIỀN</a><a href="/seller.html">BÁN HÀNG</a><a href="/account.html">CÁ NHÂN</a></div>
<main class="page"><div class="panel content-card"><div class="section-head" style="margin-top:0"><h2>TRUNG TÂM TÀI KHOẢN</h2></div><div class="info-grid" id="profile"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><a class="btn" href="/history.html">LỊCH SỬ MUA</a><a class="btn primary" href="/deposit.html">NẠP TIỀN</a><a class="btn" href="/seller.html">ĐĂNG KÝ BÁN HÀNG</a><button class="btn bad" onclick="logout()">ĐĂNG XUẤT</button></div></div></main><script>
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Có lỗi xảy ra');return j}
function money(n){return Number(n||0).toLocaleString('vi-VN')+'đ'}
async function current(){try{const u=await api('/api/me');document.querySelectorAll('[data-balance]').forEach(e=>e.textContent=money(u.balance));return u}catch{return null}}
async function goAccount(){const u=await current();if(!u){openAuth();return}location.href=u.role==='admin'?'/admin.html':u.role==='seller'?'/seller.html':'/account.html'}
function doSearch(){const q=(document.getElementById('globalSearch')?.value||'').trim();location.href='/products.html'+(q?'?q='+encodeURIComponent(q):'')}
function openAuth(){document.getElementById('authModal')?.classList.add('open')}function closeAuth(){document.getElementById('authModal')?.classList.remove('open')}
function switchAuth(t){document.querySelectorAll('.auth-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));document.querySelectorAll('.auth-pane').forEach(x=>x.classList.toggle('active',x.id==='pane-'+t))}
async function login(){try{const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({identity:loginIdentity.value,password:loginPassword.value})});location.href=r.redirect}catch(e){alert(e.message)}}
async function register(){try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({username:regUsername.value,email:regEmail.value,password:regPassword.value})});location.href='/account.html'}catch(e){alert(e.message)}}
async function forgot(){const email=prompt('Nhập email đã đăng ký');if(!email)return;try{await api('/api/auth/forgot',{method:'POST',body:JSON.stringify({email})});alert('Đã xử lý yêu cầu khôi phục')}catch(e){alert(e.message)}}

async function load(){const u=await current();if(!u)return location.href='/?login=1';if(u.role==='admin')return location.href='/admin.html';if(u.role==='seller')return location.href='/seller.html';profile.innerHTML=`<div class="panel content-card"><small class="hint">TÊN ĐĂNG NHẬP</small><b>${u.username}</b></div><div class="panel content-card"><small class="hint">EMAIL</small><b>${u.email}</b></div><div class="panel content-card"><small class="hint">SỐ DƯ</small><b style="color:#ffc936">${money(u.balance)}</b></div><div class="panel content-card"><small class="hint">SELLER</small><b>${u.seller_verification}</b></div>`}async function logout(){await api('/api/auth/logout',{method:'POST'});location.href='/'}load();</script></body></html>
