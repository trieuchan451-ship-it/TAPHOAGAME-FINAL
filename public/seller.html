<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bán hàng</title><link rel="stylesheet" href="/style.css"></head><body><div class="topbar"><div class="head"><div class="brand">TAPHOAGAME.VN<small>MARKETPLACE TÀI KHOẢN GAME</small></div><div class="search"><input id="searchInput" placeholder="Tìm acc, game, người bán..."><button onclick="searchNow()">TÌM</button></div><div class="userbar"><span class="pill">Số dư: <b id="balance">0đ</b></span><button class="btn primary" onclick="openAccount()">TÀI KHOẢN</button></div></div><nav><a href="/">TRANG CHỦ</a><a href="/products.html">MUA ACC</a><a href="/deposit.html">NẠP TIỀN</a><a href="/history.html">LỊCH SỬ</a><a href="/seller.html">BÁN HÀNG</a></nav></div><div class="mobile-bottom"><a href="/">TRANG CHỦ</a><a href="/products.html">MUA ACC</a><a href="/deposit.html">NẠP TIỀN</a><a href="/seller.html">BÁN HÀNG</a><a href="/account.html">CÁ NHÂN</a></div><main class="wrap"><div class="section-head"><h1>TRUNG TÂM BÁN HÀNG</h1></div><div id="area"></div></main><script>
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Có lỗi xảy ra');return j}
function money(n){return Number(n||0).toLocaleString('vi-VN')+'đ'}
async function current(){try{const u=await api('/api/me');document.querySelectorAll('#balance').forEach(e=>e.textContent=money(u.balance));return u}catch{return null}}
async function openAccount(){const u=await current();if(!u)return location.href='/?login=1';location.href=u.role==='admin'?'/admin.html':u.role==='seller'?'/seller.html':'/account.html'}
function searchNow(){const q=(document.getElementById('searchInput')?.value||'').trim();location.href='/products.html'+(q?'?q='+encodeURIComponent(q):'')}

async function load(){const u=await current();if(!u)return location.href='/?login=1';if(u.role==='admin')return location.href='/admin.html';if(u.role==='seller'){area.innerHTML=`<div class="card"><h2>ĐĂNG ACC</h2><div class="notice">Acc chỉ xuất hiện sau khi Admin duyệt. Phí shop được tính khi bán thành công.</div><form id="pf"><div class="row"><select name="game"><option value="lienquan">Liên Quân</option><option value="freefire">Free Fire</option><option value="pubg">PUBG</option><option value="khac">Khác</option></select><input name="price" type="number" placeholder="Giá bán" required></div><input name="title" placeholder="Tên sản phẩm" required><textarea name="description" placeholder="Mô tả acc" required></textarea><div class="row"><input name="account_login" placeholder="Tài khoản game" required><input name="account_password" placeholder="Mật khẩu game" required></div><input name="image" type="file" accept="image/jpeg,image/png,image/webp"><button class="btn primary">GỬI ADMIN DUYỆT</button></form><hr><div class="card stat"><span>SỐ DƯ BÁN HÀNG</span><strong>${money(u.seller_balance)}</strong></div><h3>RÚT TIỀN</h3><div class="row"><input id="wa" type="number" placeholder="Số tiền"><input id="wb" placeholder="Ngân hàng"></div><div class="row"><input id="wn" placeholder="Số tài khoản"><input id="wname" placeholder="Tên chủ tài khoản"></div><button class="btn" onclick="withdraw()">GỬI YÊU CẦU RÚT</button></div>`;pf.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/products',{method:'POST',body:new FormData(e.target)});alert('Đã gửi acc chờ duyệt');e.target.reset()}catch(x){alert(x.message)}});return}const st=await api('/api/seller/status');if(st){area.innerHTML=`<div class="card"><h2>HỒ SƠ BÁN HÀNG</h2><div class="notice">Trạng thái: <b>${st.status}</b><br>${st.admin_note||''}</div></div>`;return}area.innerHTML=`<div class="card"><h2>ĐĂNG KÝ BÁN HÀNG</h2><p class="muted">CCCD được gửi để Admin kiểm duyệt. Production cần chuyển ảnh CCCD sang private storage.</p><form id="sf"><input name="full_name" placeholder="Họ và tên" required><input name="phone" placeholder="Số điện thoại" required><div class="row"><div><label>CCCD mặt trước</label><input name="cccd_front" type="file" accept="image/jpeg,image/png,image/webp" required></div><div><label>CCCD mặt sau</label><input name="cccd_back" type="file" accept="image/jpeg,image/png,image/webp" required></div></div><button class="btn primary">GỬI HỒ SƠ</button></form></div>`;sf.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/seller/apply',{method:'POST',body:new FormData(e.target)});alert('Đã gửi hồ sơ');load()}catch(x){alert(x.message)}})}
async function withdraw(){try{await api('/api/withdrawals',{method:'POST',body:JSON.stringify({amount:Number(wa.value),bank:wb.value,account_no:wn.value,account_name:wname.value})});alert('Đã gửi yêu cầu rút')}catch(e){alert(e.message)}}load();</script></body></html>
