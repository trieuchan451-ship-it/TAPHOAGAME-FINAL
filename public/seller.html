<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bán hàng</title><link rel="stylesheet" href="/style.css?v=20"></head><body>
<div class="site-header"><div class="shell"><div class="header-main"><a class="brand" href="/"><div class="brand-logo">TG</div><div><strong>TAPHOAGAME.VN</strong><small>PREMIUM GAME ACCOUNT MARKETPLACE</small></div></a><div class="search"><input id="q" placeholder="Tìm kiếm acc theo game, giá, người bán..."><button onclick="doSearch()">TÌM</button></div><div class="user-actions"><div class="wallet"><small>SỐ DƯ</small><b data-balance>0đ</b></div><a class="btn primary" href="/deposit.html">+ NẠP TIỀN</a><button class="btn" onclick="goAccount()">TÀI KHOẢN</button></div></div><div class="nav"><a href="/">TRANG CHỦ</a><a href="/products.html">TẤT CẢ ACC</a><a href="/deposit.html">NẠP TIỀN</a><a href="/history.html">LỊCH SỬ</a><a href="/seller.html">BÁN HÀNG</a><a href="/account.html">CÁ NHÂN</a></div></div></div><div class="mobile-nav"><a href="/">TRANG CHỦ</a><a href="/products.html">MUA ACC</a><a href="/deposit.html">NẠP TIỀN</a><a href="/seller.html">BÁN HÀNG</a><a href="/account.html">CÁ NHÂN</a></div>
<main class="shell page"><div class="panel content"><div class="section-head" style="margin-top:0"><h1>TRUNG TÂM BÁN HÀNG</h1><span>Seller phải được Admin duyệt</span></div><div id="area"></div></div></main><script>
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Có lỗi xảy ra');return j}
function money(n){return Number(n||0).toLocaleString('vi-VN')+'đ'}
async function current(){try{const u=await api('/api/me');document.querySelectorAll('[data-balance]').forEach(x=>x.textContent=money(u.balance));return u}catch{return null}}
async function goAccount(){const u=await current();if(!u){openAuth();return}location.href=u.role==='admin'?'/admin.html':u.role==='seller'?'/seller.html':'/account.html'}
function doSearch(){const q=(document.getElementById('q')?.value||'').trim();location.href='/products.html'+(q?'?q='+encodeURIComponent(q):'')}
function openAuth(){document.getElementById('auth')?.classList.add('open')}function closeAuth(){document.getElementById('auth')?.classList.remove('open')}
function tab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id==='pane-'+t))}
async function login(){try{const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({identity:li.value,password:lp.value})});location.href=r.redirect}catch(e){alert(e.message)}}
async function register(){try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({username:ru.value,email:re.value,password:rp.value})});location.href='/account.html'}catch(e){alert(e.message)}}
async function logout(){await api('/api/auth/logout',{method:'POST'});location.href='/'}

async function load(){const u=await current();if(!u)return location.href='/?login=1';if(u.role==='admin')return location.href='/admin.html';
if(u.role==='seller'){area.innerHTML=`<div class="panel content"><h2>ĐĂNG ACC MỚI</h2><div class="notice">Acc được lưu ở trạng thái chờ duyệt. Chỉ khi Admin duyệt mới xuất hiện trên marketplace.</div><form id="pf"><div class="row"><select name="game"><option value="lienquan">Liên Quân</option><option value="freefire">Free Fire</option><option value="pubg">PUBG</option><option value="khac">Game khác</option></select><input name="price" type="number" placeholder="Giá bán" required></div><input name="title" placeholder="Tên sản phẩm" required><textarea name="description" placeholder="Mô tả chi tiết acc" required></textarea><div class="row"><input name="account_login" placeholder="Tài khoản game" required><input name="account_password" placeholder="Mật khẩu game" required></div><input name="image" type="file" accept="image/jpeg,image/png,image/webp"><button class="btn primary">GỬI ADMIN DUYỆT</button></form></div><div class="panel content" style="margin-top:12px"><div class="stat"><small>SỐ DƯ BÁN HÀNG</small><b>${money(u.seller_balance)}</b></div><h2>RÚT TIỀN</h2><div class="row"><input id="wa" type="number" placeholder="Số tiền"><input id="wb" placeholder="Ngân hàng"></div><div class="row"><input id="wn" placeholder="Số tài khoản"><input id="wname" placeholder="Tên chủ tài khoản"></div><button class="btn" onclick="withdraw()">GỬI YÊU CẦU RÚT</button></div>`;pf.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/products',{method:'POST',body:new FormData(e.target)});alert('Đã gửi acc chờ duyệt');e.target.reset()}catch(x){alert(x.message)}});return}
const st=await api('/api/seller/status');if(st){area.innerHTML=`<div class="panel content"><h2>HỒ SƠ SELLER</h2><div class="stat"><small>TRẠNG THÁI</small><b>${st.status}</b></div><div class="notice">${st.admin_note||'Hồ sơ đang chờ Admin kiểm tra.'}</div></div>`;return}
area.innerHTML=`<div class="panel content"><h2>ĐĂNG KÝ BÁN HÀNG</h2><div class="notice">Gửi hồ sơ để Admin kiểm duyệt. Sau khi được duyệt, tài khoản mới có quyền đăng acc.</div><form id="sf"><div class="row"><input name="full_name" placeholder="Họ và tên" required><input name="phone" placeholder="Số điện thoại" required></div><div class="row"><div><div class="hint">CCCD MẶT TRƯỚC</div><input name="cccd_front" type="file" accept="image/jpeg,image/png,image/webp" required></div><div><div class="hint">CCCD MẶT SAU</div><input name="cccd_back" type="file" accept="image/jpeg,image/png,image/webp" required></div></div><button class="btn primary">GỬI HỒ SƠ SELLER</button></form></div>`;sf.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/seller/apply',{method:'POST',body:new FormData(e.target)});alert('Đã gửi hồ sơ');load()}catch(x){alert(x.message)}})}
async function withdraw(){try{await api('/api/withdrawals',{method:'POST',body:JSON.stringify({amount:Number(wa.value),bank:wb.value,account_no:wn.value,account_name:wname.value})});alert('Đã gửi yêu cầu rút')}catch(e){alert(e.message)}}load();</script></body></html>
