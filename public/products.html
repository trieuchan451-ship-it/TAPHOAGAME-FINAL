<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kho acc</title><link rel="stylesheet" href="/style.css"></head><body><div class="topbar"><div class="head"><div class="brand">TAPHOAGAME.VN<small>MARKETPLACE TÀI KHOẢN GAME</small></div><div class="search"><input id="searchInput" placeholder="Tìm acc, game, người bán..."><button onclick="searchNow()">TÌM</button></div><div class="userbar"><span class="pill">Số dư: <b id="balance">0đ</b></span><button class="btn primary" onclick="openAccount()">TÀI KHOẢN</button></div></div><nav><a href="/">TRANG CHỦ</a><a href="/products.html">MUA ACC</a><a href="/deposit.html">NẠP TIỀN</a><a href="/history.html">LỊCH SỬ</a><a href="/seller.html">BÁN HÀNG</a></nav></div><div class="mobile-bottom"><a href="/">TRANG CHỦ</a><a href="/products.html">MUA ACC</a><a href="/deposit.html">NẠP TIỀN</a><a href="/seller.html">BÁN HÀNG</a><a href="/account.html">CÁ NHÂN</a></div><main class="wrap"><div class="section-head"><h1>KHO ACC GAME</h1><span class="muted">Chỉ hiển thị acc đã duyệt</span></div><section id="list" class="grid"></section></main><script>
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Có lỗi xảy ra');return j}
function money(n){return Number(n||0).toLocaleString('vi-VN')+'đ'}
async function current(){try{const u=await api('/api/me');document.querySelectorAll('#balance').forEach(e=>e.textContent=money(u.balance));return u}catch{return null}}
async function openAccount(){const u=await current();if(!u)return location.href='/?login=1';location.href=u.role==='admin'?'/admin.html':u.role==='seller'?'/seller.html':'/account.html'}
function searchNow(){const q=(document.getElementById('searchInput')?.value||'').trim();location.href='/products.html'+(q?'?q='+encodeURIComponent(q):'')}

async function load(){await current();const q=new URLSearchParams(location.search),game=q.get('game'),text=(q.get('q')||'').toLowerCase();let p=await api('/api/products'+(game?'?game='+encodeURIComponent(game):''));if(text)p=p.filter(x=>(x.title+' '+x.description+' '+x.seller+' '+x.game).toLowerCase().includes(text));list.innerHTML=p.length?p.map(x=>`<div class="card product">${x.image?`<img src="/uploads/${x.image}">`:''}<h3>${x.title}</h3><div class="muted">Người bán: ${x.seller}</div><p>${x.description}</p><div class="price">${money(x.price)}</div><div class="row"><button class="btn primary" onclick="buy(${x.id})">MUA NGAY</button><button class="btn" onclick="chat(${x.seller_id},${x.id})">CHAT</button></div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">KHÔNG CÓ ACC PHÙ HỢP</div>'}
async function buy(id){try{const r=await api('/api/orders/'+id+'/buy',{method:'POST'});alert('Mua thành công\nTài khoản: '+r.account+'\nMật khẩu: '+r.password);location.href='/history.html'}catch(e){alert(e.message)}}async function chat(to,product){const u=await current();if(!u)return location.href='/?login=1';location.href='/chat.html?with='+to+'&product='+product}load();</script></body></html>
