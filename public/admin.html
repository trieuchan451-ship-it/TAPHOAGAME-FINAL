<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin TAPHOAGAME</title><link rel="stylesheet" href="/admin.css?v=30"></head><body><div class="mobile"><button onclick="show('dashboard')">TỔNG QUAN</button><button onclick="show('users')">TÀI KHOẢN</button><button onclick="show('seller')">SELLER</button><button onclick="show('products')">ACC</button><button onclick="show('auction')">ĐẤU GIÁ</button><button onclick="show('complaints')">KHIẾU NẠI</button><button onclick="show('money')">TIỀN</button><button onclick="show('audit')">LOG</button></div><div class="shell"><aside class="side"><h1>TAPHOAGAME.VN<br><small>BỘ ĐIỀU KHIỂN ADMIN</small></h1><button onclick="show('dashboard')">TỔNG QUAN</button><button onclick="show('users')">TÀI KHOẢN & IP</button><button onclick="show('seller')">DUYỆT NGƯỜI BÁN</button><button onclick="show('products')">QUẢN LÝ ACC</button><button onclick="show('auction')">ĐẤU GIÁ</button><button onclick="show('complaints')">KHIẾU NẠI / BẢO HÀNH</button><button onclick="show('money')">NẠP / RÚT</button><button onclick="show('audit')">NHẬT KÝ</button><a href="/">VỀ WEBSITE</a></aside><main class="main"><div class="top"><h1>BỘ ĐIỀU KHIỂN ADMIN</h1><button class="btn" onclick="loadAll()">LÀM MỚI</button></div><section id="dashboard" class="panel on"><div id="stats" class="stats"></div></section><section id="users" class="panel"><div class="card"><h2>TÀI KHOẢN</h2><div id="usersList"></div></div></section><section id="seller" class="panel"><div class="card"><h2>HỒ SƠ NGƯỜI BÁN</h2><div id="sellerList"></div></div></section><section id="products" class="panel"><div class="card"><h2>SẢN PHẨM</h2><div id="productList"></div></div></section><section id="auction" class="panel"><div class="card"><h2>PHIÊN ĐẤU GIÁ</h2><div id="auctionList"></div></div></section><section id="complaints" class="panel"><div class="card"><h2>KHIẾU NẠI / BẢO HÀNH</h2><div id="complaintList"></div></div></section><section id="money" class="panel"><div class="card"><h2>NẠP TIỀN</h2><div id="depositList"></div></div><div class="card"><h2>RÚT TIỀN</h2><div id="withdrawList"></div></div></section><section id="audit" class="panel"><div class="card"><h2>NHẬT KÝ HỆ THỐNG</h2><div id="auditList"></div></div></section></main></div>
<script>
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Có lỗi');return j}
function money(n){return Number(n||0).toLocaleString('vi-VN')+'đ'}function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===id))}
async function guard(){try{const u=await api('/api/me');if(u.role!=='admin')throw 0}catch{location.href='/?login=1';throw 0}}
async function loadAll(){await guard();const [st,u,s,p,a,c,d,w,l]=await Promise.all([api('/api/admin/stats'),api('/api/admin/users'),api('/api/admin/seller-applications'),api('/api/admin/products'),api('/api/admin/auctions'),api('/api/admin/complaints'),api('/api/admin/deposits'),api('/api/admin/withdrawals'),api('/api/admin/audit')]);
stats.innerHTML=`<div class="card stat"><small>THÀNH VIÊN</small><b>${st.users}</b></div><div class="card stat"><small>NGƯỜI BÁN</small><b>${st.sellers}</b></div><div class="card stat"><small>ĐƠN HÀNG</small><b>${st.orders}</b></div><div class="card stat"><small>TIỀN ĐANG GIỮ</small><b>${money(st.held)}</b></div><div class="card stat"><small>KHIẾU NẠI MỞ</small><b>${st.complaints}</b></div>`;
usersList.innerHTML=`<table><tr><th>ID</th><th>User</th><th>Email</th><th>Role</th><th>Status</th><th>Số dư</th><th>Giữ</th><th>IP đăng ký</th><th>IP gần nhất</th><th>Thao tác</th></tr>${u.map(x=>`<tr><td>${x.id}</td><td>${x.username}</td><td>${x.email}</td><td>${x.role}</td><td>${x.status}</td><td>${money(x.balance)}</td><td>${money(x.held_balance)}</td><td>${x.register_ip||''}</td><td>${x.last_login_ip||''}</td><td>${x.role!=='admin'?`<button class="btn ${x.status==='active'?'bad':'good'}" onclick="toggle(${x.id})">${x.status==='active'?'KHÓA':'MỞ'}</button> <button class="btn warn" onclick="resetPw(${x.id})">ĐẶT LẠI MK</button> <button class="btn bad" onclick="delUser(${x.id})">XÓA</button> ${x.last_login_ip?`<button class="btn bad" onclick="banIp('${x.last_login_ip}')">CẤM IP</button>`:''}`:''}</td></tr>`).join('')}</table>`;
sellerList.innerHTML=s.length?s.map(x=>`<div class="card"><b>${x.username}</b> • ${x.full_name} • ${x.phone} • Đồng ý quy định: ${x.accepted_rules?'Có':'Không'}<br><button class="btn good" onclick="approveSeller(${x.id})">DUYỆT</button> <button class="btn bad" onclick="rejectSeller(${x.id})">TỪ CHỐI</button></div>`).join(''):'Không có hồ sơ';
productList.innerHTML=p.length?p.map(x=>`<div class="card"><b>${x.title}</b> • ${x.seller} • ${money(x.price)} • ${x.status}<br>${x.status==='pending'?`<button class="btn good" onclick="approveProduct(${x.id})">DUYỆT</button> <button class="btn bad" onclick="rejectProduct(${x.id})">TỪ CHỐI</button>`:''}</div>`).join(''):'Không có sản phẩm';
auctionList.innerHTML=a.length?a.map(x=>`<div class="card"><b>${x.title}</b> • ${x.seller} • ${money(x.current_price)} • ${x.status}<br>${x.status==='pending'?`<button class="btn good" onclick="approveAuction(${x.id})">DUYỆT</button>`:''} ${['pending','approved'].includes(x.status)?`<button class="btn bad" onclick="cancelAuction(${x.id})">HỦY</button>`:''}</div>`).join(''):'Không có đấu giá';
complaintList.innerHTML=c.length?c.map(x=>`<div class="card"><b>Đơn #${x.order_id} • ${x.title}</b><br>Người mua: ${x.buyer} • Người bán: ${x.seller}<br><span class="muted">${x.type}: ${x.description}</span><br>Trạng thái: ${x.status}${x.status==='open'?`<br><button class="btn good" onclick="resolveComplaint(${x.id},'seller')">TRẢ TIỀN SELLER</button> <button class="btn bad" onclick="resolveComplaint(${x.id},'refund')">HOÀN TIỀN BUYER</button>`:''}</div>`).join(''):'Không có khiếu nại';
depositList.innerHTML=d.length?d.map(x=>`<div class="card">${x.username} • ${money(x.amount)} • ${x.transfer_code} • ${x.status}${x.status==='pending'?`<br><button class="btn good" onclick="approveDeposit(${x.id})">XÁC NHẬN ĐÃ NHẬN TIỀN</button>`:''}</div>`).join(''):'Không có yêu cầu nạp';
withdrawList.innerHTML=w.length?w.map(x=>`<div class="card">${x.username} • ${money(x.amount)} • ${x.bank} ${x.account_no} • ${x.status}${x.status==='pending'?`<br><button class="btn good" onclick="approveWithdrawal(${x.id})">ĐÃ CHUYỂN</button> <button class="btn bad" onclick="rejectWithdrawal(${x.id})">TỪ CHỐI</button>`:''}</div>`).join(''):'Không có yêu cầu rút';
auditList.innerHTML=l.length?l.map(x=>`<div class="card"><b>${x.action}</b> • ${x.actor||'hệ thống'} • ${x.target_type} #${x.target_id}<div class="muted">${new Date(x.created_at).toLocaleString('vi-VN')}</div></div>`).join(''):'Chưa có nhật ký'}
async function toggle(id){await api('/api/admin/users/'+id+'/toggle-lock',{method:'POST'});loadAll()}async function resetPw(id){const p=prompt('Nhập mật khẩu mới (tối thiểu 8 ký tự)');if(!p)return;try{await api('/api/admin/users/'+id+'/reset-password',{method:'POST',body:JSON.stringify({password:p})});alert('Đã đặt lại mật khẩu')}catch(e){alert(e.message)}}async function delUser(id){if(!confirm('Xóa tài khoản này? Tài khoản đã có giao dịch sẽ không thể xóa cứng.'))return;try{await api('/api/admin/users/'+id,{method:'DELETE'});loadAll()}catch(e){alert(e.message)}}async function banIp(ip){const r=prompt('Lý do cấm IP','Vi phạm / hành vi bất thường');if(r===null)return;await api('/api/admin/ip-ban',{method:'POST',body:JSON.stringify({ip,reason:r})});alert('Đã cấm IP')}
async function approveSeller(id){await api('/api/admin/seller-applications/'+id+'/approve',{method:'POST'});loadAll()}async function rejectSeller(id){await api('/api/admin/seller-applications/'+id+'/reject',{method:'POST',body:JSON.stringify({note:'Từ chối bởi Admin'})});loadAll()}async function approveProduct(id){await api('/api/admin/products/'+id+'/approve',{method:'POST'});loadAll()}async function rejectProduct(id){await api('/api/admin/products/'+id+'/reject',{method:'POST',body:JSON.stringify({note:'Từ chối bởi Admin'})});loadAll()}async function approveAuction(id){await api('/api/admin/auctions/'+id+'/approve',{method:'POST'});loadAll()}async function cancelAuction(id){await api('/api/admin/auctions/'+id+'/cancel',{method:'POST'});loadAll()}async function resolveComplaint(id,decision){const note=prompt('Ghi chú xử lý','');await api('/api/admin/complaints/'+id+'/resolve',{method:'POST',body:JSON.stringify({decision,note})});loadAll()}async function approveDeposit(id){if(confirm('Đã kiểm tra tiền thực tế vào tài khoản?')){await api('/api/admin/deposits/'+id+'/approve',{method:'POST'});loadAll()}}async function approveWithdrawal(id){await api('/api/admin/withdrawals/'+id+'/approve',{method:'POST',body:JSON.stringify({note:'Đã chuyển khoản'})});loadAll()}async function rejectWithdrawal(id){await api('/api/admin/withdrawals/'+id+'/reject',{method:'POST',body:JSON.stringify({note:'Từ chối bởi Admin'})});loadAll()}loadAll();
</script></body></html>
