<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin TAPHOAGAME</title><link rel="stylesheet" href="/admin.css"></head><body><div class="mobile"><button onclick="show('dashboard')">TỔNG QUAN</button><button onclick="show('users')">TÀI KHOẢN</button><button onclick="show('sellers')">SELLER</button><button onclick="show('products')">ACC</button><button onclick="show('orders')">ĐƠN</button><button onclick="show('deposits')">NẠP</button><button onclick="show('withdrawals')">RÚT</button><button onclick="show('audit')">LOG</button></div><div class="shell"><aside class="side"><h1>TAPHOAGAME.VN<br><small>ADMIN CONTROL</small></h1><button onclick="show('dashboard')">TỔNG QUAN</button><button onclick="show('users')">TÀI KHOẢN</button><button onclick="show('sellers')">DUYỆT NGƯỜI BÁN</button><button onclick="show('products')">QUẢN LÝ ACC</button><button onclick="show('orders')">ĐƠN HÀNG</button><button onclick="show('deposits')">NẠP TIỀN</button><button onclick="show('withdrawals')">RÚT TIỀN</button><button onclick="show('audit')">AUDIT LOG</button><a href="/">VỀ WEBSITE</a></aside><main class="main"><div class="top"><h1>BỘ ĐIỀU KHIỂN ADMIN</h1><button class="btn" onclick="loadAll()">LÀM MỚI</button></div><section id="dashboard" class="panel on"><div id="stats" class="stats"></div></section><section id="users" class="panel"><div class="card"><h2>TÀI KHOẢN</h2><div id="usersList"></div></div></section><section id="sellers" class="panel"><div class="card"><h2>HỒ SƠ NGƯỜI BÁN</h2><div id="sellerList"></div></div></section><section id="products" class="panel"><div class="card"><h2>SẢN PHẨM</h2><div id="productList"></div></div></section><section id="orders" class="panel"><div class="card"><h2>ĐƠN HÀNG</h2><div id="orderList"></div></div></section><section id="deposits" class="panel"><div class="card"><h2>NẠP TIỀN</h2><div class="muted">Chỉ xác nhận sau khi kiểm tra tiền thực tế.</div><div id="depositList"></div></div></section><section id="withdrawals" class="panel"><div class="card"><h2>RÚT TIỀN</h2><div id="withdrawList"></div></div></section><section id="audit" class="panel"><div class="card"><h2>AUDIT LOG</h2><div id="auditList"></div></div></section></main></div>
<script>
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Có lỗi');return j}
function money(n){return Number(n||0).toLocaleString('vi-VN')+'đ'}function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===id))}
async function guard(){try{const u=await api('/api/me');if(u.role!=='admin')throw Error()}catch{location.href='/?login=1';throw Error()}}
async function loadAll(){await guard();const [st,u,s,p,o,d,w,a]=await Promise.all([api('/api/admin/stats'),api('/api/admin/users'),api('/api/admin/seller-applications'),api('/api/admin/products'),api('/api/admin/orders'),api('/api/admin/deposits'),api('/api/admin/withdrawals'),api('/api/admin/audit')]);stats.innerHTML=`<div class="card stat"><span>THÀNH VIÊN</span><strong>${st.users}</strong></div><div class="card stat"><span>NGƯỜI BÁN</span><strong>${st.sellers}</strong></div><div class="card stat"><span>ĐƠN HÀNG</span><strong>${st.orders}</strong></div><div class="card stat"><span>PHÍ SHOP</span><strong>${money(st.fees)}</strong></div>`;
usersList.innerHTML=`<table><tr><th>ID</th><th>User</th><th>Email</th><th>Role</th><th>Status</th><th>Số dư</th><th></th></tr>${u.map(x=>`<tr><td>${x.id}</td><td>${x.username}</td><td>${x.email}</td><td>${x.role}</td><td>${x.status}</td><td>${money(x.balance)}</td><td>${x.role!=='admin'?`<button class="btn ${x.status==='active'?'bad':'good'}" onclick="toggle(${x.id})">${x.status==='active'?'KHÓA':'MỞ'}</button>`:''}</td></tr>`).join('')}</table>`;
sellerList.innerHTML=s.length?s.map(x=>`<div class="card"><b>${x.username}</b> • ${x.full_name} • ${x.phone}<br><button class="btn good" onclick="approveSeller(${x.id})">DUYỆT</button> <button class="btn bad" onclick="rejectSeller(${x.id})">TỪ CHỐI</button></div>`).join(''):'Không có hồ sơ chờ duyệt';
productList.innerHTML=p.length?p.map(x=>`<div class="card"><b>${x.title}</b> • ${x.seller} • ${money(x.price)} • <b>${x.status}</b><br>${x.status==='pending'?`<button class="btn good" onclick="approveProduct(${x.id})">DUYỆT</button> <button class="btn bad" onclick="rejectProduct(${x.id})">TỪ CHỐI</button> `:''}${x.status!=='sold'?`<button class="btn bad" onclick="deleteProduct(${x.id})">XÓA</button>`:''}</div>`).join(''):'Không có sản phẩm';
orderList.innerHTML=o.length?`<table><tr><th>ID</th><th>Buyer</th><th>Seller</th><th>Acc</th><th>Giá</th><th>Phí</th></tr>${o.map(x=>`<tr><td>${x.id}</td><td>${x.buyer}</td><td>${x.seller}</td><td>${x.title}</td><td>${money(x.amount)}</td><td>${money(x.fee)}</td></tr>`).join('')}</table>`:'Chưa có đơn';
depositList.innerHTML=d.length?d.map(x=>`<div class="card">${x.username} • ${money(x.amount)} • ${x.transfer_code} • <b>${x.status}</b>${x.status==='pending'?`<br><button class="btn good" onclick="approveDeposit(${x.id})">XÁC NHẬN ĐÃ NHẬN TIỀN</button>`:''}</div>`).join(''):'Không có yêu cầu nạp';
withdrawList.innerHTML=w.length?w.map(x=>`<div class="card">${x.username} • ${money(x.amount)} • ${x.bank} ${x.account_no} • <b>${x.status}</b>${x.status==='pending'?`<br><button class="btn good" onclick="approveWithdrawal(${x.id})">ĐÃ CHUYỂN</button> <button class="btn bad" onclick="rejectWithdrawal(${x.id})">TỪ CHỐI</button>`:''}</div>`).join(''):'Không có yêu cầu rút';
auditList.innerHTML=a.length?a.map(x=>`<div class="card"><b>${x.action}</b> • actor: ${x.actor||'system'} • ${x.target_type} #${x.target_id}<div class="muted">${new Date(x.created_at).toLocaleString('vi-VN')}</div></div>`).join(''):'Chưa có log'}
async function toggle(id){await api('/api/admin/users/'+id+'/toggle-lock',{method:'POST'});loadAll()}async function approveSeller(id){await api('/api/admin/seller-applications/'+id+'/approve',{method:'POST'});loadAll()}async function rejectSeller(id){await api('/api/admin/seller-applications/'+id+'/reject',{method:'POST',body:JSON.stringify({note:'Từ chối bởi Admin'})});loadAll()}async function approveProduct(id){await api('/api/admin/products/'+id+'/approve',{method:'POST'});loadAll()}async function rejectProduct(id){await api('/api/admin/products/'+id+'/reject',{method:'POST',body:JSON.stringify({note:'Từ chối bởi Admin'})});loadAll()}async function deleteProduct(id){if(confirm('Xóa sản phẩm này?')){await api('/api/admin/products/'+id,{method:'DELETE'});loadAll()}}async function approveDeposit(id){if(confirm('Đã kiểm tra tiền thực tế vào ngân hàng?')){await api('/api/admin/deposits/'+id+'/approve',{method:'POST'});loadAll()}}async function approveWithdrawal(id){await api('/api/admin/withdrawals/'+id+'/approve',{method:'POST',body:JSON.stringify({note:'Đã chuyển khoản'})});loadAll()}async function rejectWithdrawal(id){await api('/api/admin/withdrawals/'+id+'/reject',{method:'POST',body:JSON.stringify({note:'Từ chối bởi Admin'})});loadAll()}loadAll();
</script></body></html>
